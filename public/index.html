<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sealed Pool Generator</title>
  <meta name="description" content="Generate sealed packs, bricks, and cases.">
  <script>
    (() => {
      const saved = localStorage.getItem("pack-generator-theme");
      if (saved === "dark" || saved === "light") {
        document.documentElement.dataset.theme = saved;
      }
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <h1>Sealed Pool Generator</h1>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">🌙</button>
    </header>

    <main class="layout">
      <section class="control-panel card">
        <div class="section-heading">
          <h2>Generate</h2>
        </div>

        <label class="field">
          <span>Set</span>
          <select id="setSelect"></select>
        </label>

        <div class="field">
          <span>Product</span>
          <div class="segmented" id="kindPicker">
            <button type="button" data-kind="pack">Pack</button>
            <button type="button" data-kind="brick">Brick</button>
            <button type="button" data-kind="case" class="active">Case</button>
          </div>
        </div>

        <button id="generateBtn" class="primary-btn" type="button">Generate case</button>

        <div class="divider"><span>or</span></div>

        <label class="field">
          <span>Open a shared code</span>
          <div class="inline-field">
            <input id="codeInput" type="text" autocomplete="off" spellcheck="false"
              placeholder="HC-TB-V1-G1-XXXXXXXXXX-B1-P01">
            <button id="openCodeBtn" type="button" class="secondary-btn">Open</button>
          </div>
        </label>
      </section>

      <section class="opening-panel card">
        <div id="emptyState" class="empty-state">
          <div class="empty-icon">✦</div>
          <h2>Generate a sealed product</h2>
          <p>Choose a set and product type, or paste a share code.</p>
        </div>

        <div id="resultView" class="hidden">
          <div class="result-topline">
            <h2 id="resultTitle">Thunderbolts Case</h2>
          </div>

          <div class="code-card">
            <div>
              <span class="code-label">Share code</span>
              <code id="resultCode"></code>
            </div>
            <button id="copyCodeBtn" class="secondary-btn compact" type="button">Copy</button>
          </div>

          <div id="hierarchy"></div>
        </div>
      </section>

      <aside class="pulls-panel card">
        <div class="section-heading compact-heading">
          <h2>Pulls</h2>
          <span id="pullCount" class="count-pill">0</span>
        </div>

        <div id="pullsEmpty" class="pulls-empty">
          Open a pack to reveal its pulls.
        </div>

        <div id="pullList" class="pull-list hidden"></div>

        <div id="downloadArea" class="download-area hidden">
          <button id="downloadO8dBtn" class="primary-btn ghost" type="button">
            Download OCTGN deck
          </button>
        </div>
      </aside>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
